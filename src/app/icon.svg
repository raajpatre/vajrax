<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Dark background -->
  <rect width="32" height="32" rx="6" fill="#07090f"/>

  <!-- Chip body -->
  <rect x="10" y="10" width="12" height="12" rx="1.5" fill="none" stroke="#00e5ff" stroke-width="1.5"/>

  <!-- Inner chip detail -->
  <rect x="13" y="13" width="6" height="6" rx="0.75" fill="#00e5ff" opacity="0.25"/>
  <rect x="14.5" y="14.5" width="3" height="3" rx="0.5" fill="#00e5ff" opacity="0.7"/>

  <!-- Left pins -->
  <line x1="10" y1="13.5" x2="7" y2="13.5" stroke="#00e5ff" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="10" y1="16" x2="7" y2="16" stroke="#00e5ff" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="10" y1="18.5" x2="7" y2="18.5" stroke="#00e5ff" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Right pins -->
  <line x1="22" y1="13.5" x2="25" y2="13.5" stroke="#00e5ff" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="22" y1="16" x2="25" y2="16" stroke="#00e5ff" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="22" y1="18.5" x2="25" y2="18.5" stroke="#00e5ff" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Top pins -->
  <line x1="13.5" y1="10" x2="13.5" y2="7" stroke="#00e5ff" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="16" y1="10" x2="16" y2="7" stroke="#00e5ff" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="18.5" y1="10" x2="18.5" y2="7" stroke="#00e5ff" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Bottom pins -->
  <line x1="13.5" y1="22" x2="13.5" y2="25" stroke="#00e5ff" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="16" y1="22" x2="16" y2="25" stroke="#00e5ff" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="18.5" y1="22" x2="18.5" y2="25" stroke="#00e5ff" stroke-width="1.2" stroke-linecap="round"/>
</svg>
